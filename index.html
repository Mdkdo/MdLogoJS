<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo JS Interpreter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Interpréteur Logo JavaScript</h1>
        </header>
        <main>
            <div class="canvas-area">
                <canvas id="turtleCanvas" width="600" height="600"></canvas>
                <canvas id="turtleLayer" width="600" height="600"></canvas>
            </div>
            <div class="controls">
                <div class="editor-section">
                    <div class="toolbar file-toolbar">
                        <button id="newFileBtn" title="Nouveau"><i class="fas fa-file"></i></button>
                        <button id="openFileBtn" title="Ouvrir"><i class="fas fa-folder-open"></i></button>
                        <button id="saveFileBtn" title="Enregistrer"><i class="fas fa-save"></i></button>
                        <button id="toolbarRunBtn" title="Exécuter"><i class="fas fa-play"></i></button>
                        <button id="themeToggleBtn" title="Mode Sombre/Clair"><i class="fas fa-moon"></i></button>
                        <button id="settingsBtn" title="Paramètres"><i class="fas fa-cog"></i></button>
                        <a href="help.html" target="_blank" class="help-link-icon" title="Aide"><i class="fas fa-question-circle"></i></a>
                    </div>
                    <div class="toolbar edit-toolbar">
                        <button id="undoBtn" title="Annuler"><i class="fas fa-undo"></i></button>
                        <button id="redoBtn" title="Rétablir"><i class="fas fa-redo"></i></button>
                        <button id="selectAllBtn" title="Sélectionner tout"><i class="fas fa-expand"></i></button>
                        <button id="copyBtn" title="Copier"><i class="fas fa-copy"></i></button>
                        <button id="cutBtn" title="Couper"><i class="fas fa-cut"></i></button>
                        <button id="pasteBtn" title="Coller"><i class="fas fa-paste"></i></button>
                        <button id="commentBtn" title="Commenter/Décommenter"><i class="fas fa-comment-slash"></i></button>
                        <button id="indentBtn" title="Augmenter l'indentation"><i class="fas fa-indent"></i></button>
                        <button id="unindentBtn" title="Réduire l'indentation"><i class="fas fa-outdent"></i></button>
                    </div>
                    <div class="editor-header">
                        <h3>Code JavaScript</h3>
                    </div>
                    <div id="editor-container">
                        <textarea id="codeEditor" spellcheck="false">repeat(4, () => {
  fd(100);
  rt(90);
});</textarea>
                        <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
                    </div>
                    <div class="buttons">
                        <button id="runBtn" class="primary">Exécuter</button>
                        <button id="clearBtn">Effacer</button>
                    </div>
                    <div class="terminal-section">
                        <div class="terminal-header">
                            <span>Terminal</span>
                            <button id="clearTerminalBtn" title="Effacer le terminal"><i class="fas fa-trash-alt"></i></button>
                        </div>
                        <div id="terminalOutput"></div>
                    </div>
                </div>
                <div class="examples-section">
                    <h3>Exemples</h3>
                    <div class="examples-grid">
                        <button class="example-btn" data-code="repeat(36, () => {
  fd(50);
  rt(10);
});">Cercle</button>
                        <button class="example-btn" data-code="for(let i=0; i<100; i++) {
  fd(i*2);
  rt(91);
}">Spirale</button>
                        <button class="example-btn" data-code="setcolor('purple');
repeat(18, () => {
  repeat(4, () => {
    fd(100);
    rt(90);
  });
  rt(20);
});">Fleur</button>
                        <button class="example-btn" data-code="cs();
fillcolor('yellow');
repeat(36, (i) => {
  fd(100);
  rt(145);
});
fill();">Étoile remplie</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Scripts split into logical modules -->
    <script src="canva.js"></script>
    <script src="syntaxe.js"></script>
    <script src="library.js"></script>
    <script src="editorSyntaxe.js"></script>
    <script src="editorUI.js"></script>
</body>
</html>
