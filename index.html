<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo JS Interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Interpréteur Logo JavaScript</h1>
        </header>
        <main>
            <div class="canvas-area">
                <canvas id="turtleCanvas" width="600" height="600"></canvas>
                <canvas id="turtleLayer" width="600" height="600"></canvas>
            </div>
            <div class="controls">
                <div class="editor-section">
                    <div class="editor-header">
                        <h3>Code JavaScript</h3>
                        <a href="help.html" target="_blank" class="help-link">Aide & Commandes</a>
                    </div>
                    <textarea id="codeEditor" spellcheck="false">repeat(4, () => {
  fd(100);
  rt(90);
});</textarea>
                    <div class="buttons">
                        <button id="runBtn" class="primary">Exécuter</button>
                        <button id="clearBtn">Effacer</button>
                    </div>
                </div>
                <div class="examples-section">
                    <h3>Exemples</h3>
                    <div class="examples-grid">
                        <button class="example-btn" data-code="repeat(36, () => {
  fd(50);
  rt(10);
});">Cercle</button>
                        <button class="example-btn" data-code="for(let i=0; i<100; i++) {
  fd(i*2);
  rt(91);
}">Spirale</button>
                        <button class="example-btn" data-code="setcolor('purple');
repeat(18, () => {
  repeat(4, () => {
    fd(100);
    rt(90);
  });
  rt(20);
});">Fleur</button>
                        <button class="example-btn" data-code="cs();
fillcolor('yellow');
repeat(36, (i) => {
  fd(100);
  rt(145);
});
fill();">Étoile remplie</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Scripts split into logical modules -->
    <script src="canva.js"></script>
    <script src="syntaxe.js"></script>
    <script src="library.js"></script>
    <script src="editorSyntaxe.js"></script>
    <script src="editorUI.js"></script>
</body>
</html>
